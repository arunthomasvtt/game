<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echoes of the Black Tide</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gameCanvas"></canvas>
      <div id="loadingOverlay" class="overlay visible">
        <h1>Echoes of the Black Tide</h1>
        <p>Initializing coastal blackout simulation...</p>
        <div class="progress-wrap"><div id="progressBar"></div></div>
      </div>
      <div id="hud" class="hud hidden">
        <div class="vitals">
          <label>Health <span id="healthValue">100</span></label>
          <div class="meter"><div id="healthBar"></div></div>
          <label>Stamina <span id="staminaValue">100</span></label>
          <div class="meter"><div id="staminaBar"></div></div>
        </div>
        <div class="objective" id="objectiveText"></div>
      </div>
      <div id="storyPanel" class="story hidden"></div>
      <div id="mobileControls" class="mobile hidden">
        <div id="joystickBase"><div id="joystickKnob"></div></div>
        <button id="interactBtn">Interact</button>
        <button id="sprintBtn">Sprint</button>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
